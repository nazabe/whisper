<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcripción de audio</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Transcripción de audio</h1>
        <p class="subtitle">
          Graba, revisa y envía el audio al servicio Whisper.
        </p>
      </header>

      <section class="card">
        <div class="status" id="status" role="status" aria-live="polite">
          Listo para grabar
        </div>

        <div class="timer" id="timer" aria-label="Duración de la grabación">
          00:00
        </div>

        <div class="meter" id="meter" hidden aria-hidden="true">
          <div class="meter-bar" id="meterBar"></div>
        </div>

        <div class="actions">
          <button id="recordButton" type="button" class="button primary">
            Grabar
          </button>
          <button id="sendButton" type="button" class="button primary" disabled>
            Enviar a transcribir
          </button>
          <button id="resetButton" type="button" class="button ghost" hidden>
            Nueva grabación
          </button>
        </div>

        <div class="actions secondary-actions">
          <button id="uploadButton" type="button" class="button ghost">
            Subir archivo
          </button>
          <input id="fileInput" type="file" accept="audio/*" hidden />
          <a id="downloadLink" class="button ghost" download hidden>
            Descargar grabación
          </a>
        </div>

        <audio id="preview" controls hidden></audio>

        <div class="options">
          <label class="field" for="language">
            <span>Idioma</span>
            <select id="language">
              <option value="es" selected>Español</option>
              <option value="auto">Detección automática</option>
              <option value="en">Inglés</option>
              <option value="pt">Portugués</option>
            </select>
          </label>

          <label class="checkbox" for="voiceProcessing">
            <input id="voiceProcessing" type="checkbox" checked />
            <span>Procesamiento de voz del navegador</span>
          </label>
        </div>

        <p class="error" id="error" role="alert" hidden></p>
      </section>

      <section class="card result" id="result" hidden>
        <div class="result-header">
          <h2>Transcripción</h2>
          <dl class="meta">
            <div>
              <dt>Idioma</dt>
              <dd id="metaLanguage">-</dd>
            </div>
            <div>
              <dt>Duración</dt>
              <dd id="metaDuration">-</dd>
            </div>
            <div>
              <dt>Grabado</dt>
              <dd id="metaRecorded">-</dd>
            </div>
          </dl>
        </div>

        <p id="fullText" class="full-text"></p>

        <h3>Segmentos</h3>
        <ol id="segments" class="segments"></ol>
      </section>
    </main>

    <script src="/ui/app.js" defer></script>
  </body>
</html>
